name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync_releases.py --check
      - name: Validate Homebrew casks
        run: |
          set -euo pipefail
          brew tap jerrylusato/tap "$GITHUB_WORKSPACE"
          brew style --cask jerrylusato/tap/mac-usage
          brew audit --cask jerrylusato/tap/mac-usage
      - name: Test installation without launching the app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apps"
          brew install --cask --appdir="$RUNNER_TEMP/apps" jerrylusato/tap/mac-usage
          APP="$RUNNER_TEMP/apps/Mac Usage.app"
          codesign --verify --strict "$APP"
          lipo "$APP/Contents/MacOS/MacUsageTracker" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$(brew info --cask --json=v2 jerrylusato/tap/mac-usage | jq -r '.casks[0].version')"
          brew uninstall --cask jerrylusato/tap/mac-usage
