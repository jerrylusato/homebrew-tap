name: Refresh releases
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-releases
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync_releases.py
      - name: Submit verified package changes
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks; then
            echo 'All casks already match the latest verified releases.'
            exit 0
          fi
          branch="chore/cask-update-$(date -u +%Y%m%d%H%M%S)"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks
          git commit -m 'chore(casks): update verified app releases'
          git push origin "$branch"
          head_sha=$(git rev-parse HEAD)
          pr=$(gh pr create --base main --head "$branch" --title 'chore(casks): update verified app releases' \
            --body 'Update only cask versions and SHA-256 checksums after verifying public release metadata, downloaded package integrity, and GitHub build provenance. Homebrew validation and installation checks must pass before merge.')
          gh workflow run verify.yml --ref "$branch"
          gh pr merge "$pr" --auto --squash --match-head-commit "$head_sha"
